swagger: '2.0'
info: {"title": "Legacy API", "version": "1.0"}
host: legacy.example.test
basePath: /v2
schemes: [https, http]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  apiKey:
    type: apiKey
    name: X-API-Key
    in: header
definitions:
  Pet:
    type: object
    properties:
      name: {type: string}
paths:
  /pets:
    post:
      parameters:
        - name: pet
          in: body
          required: true
          schema:
            $ref: '#/definitions/Pet'
      responses:
        '200':
          description: Created
          schema:
            $ref: '#/definitions/Pet'
