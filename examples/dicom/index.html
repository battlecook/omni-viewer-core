<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DICOM viewer example</title>
<style>body{margin:0;background:#181b20;color:#e0e4ea;font:14px system-ui}header{padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input{font:inherit}#error{color:#ffbb9b;white-space:pre-wrap;margin:0 16px}</style>
<header><strong>DICOM</strong><button id="demo">합성 샘플 열기</button><label>파일 열기 <input type="file" id="file" accept=".dcm,.dicom,application/dicom"></label><span>영상과 메타데이터는 브라우저에서 처리됩니다.</span></header>
<p id="error" role="alert"></p><main id="viewer"></main>
<script type="module">
import { mountDicomViewer } from '../../dist/viewers/dicom/index.js';
import { createCatalogI18n } from '../../dist/i18n/index.js';
const container = document.querySelector('#viewer'), error = document.querySelector('#error');
const ctx = { assets: { resolveAssetUrl: async path => path }, i18n: createCatalogI18n('ko'), logger: { log: console.log } };
let handle, generation = 0;
async function open(fileName, data, request) {
    if (request !== generation) return;
    error.textContent = '';
    handle?.dispose(); handle = undefined;
    try { handle = await mountDicomViewer({ fileName, data }, container, ctx); }
    catch (e) { error.textContent = e instanceof Error ? e.message : String(e); }
}
async function demo() {
    const request = ++generation;
    try { const response = await fetch('./synthetic-phantom.dcm'); if (!response.ok) throw new Error('샘플을 불러올 수 없습니다.'); await open('synthetic-phantom.dcm', new Uint8Array(await response.arrayBuffer()), request); }
    catch (e) { if (request === generation) error.textContent = String(e); }
}
document.querySelector('#demo').addEventListener('click', demo);
document.querySelector('#file').addEventListener('change', async event => {
    const file = event.target.files[0]; if (!file) return; const request = ++generation;
    try { await open(file.name, new Uint8Array(await file.arrayBuffer()), request); }
    catch (e) { if (request === generation) error.textContent = String(e); }
});
window.addEventListener('pagehide', () => handle?.dispose());
demo();
</script>
</html>
