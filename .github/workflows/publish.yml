name: Publish to npm

# The single npm upload path, reached two ways: called by release.yml on a `v*`
# tag push, or dispatched by hand to re-publish a version whose upload failed
# after the GitHub Release was already created.
#
# Everything publishes through this file on purpose. npm's trusted publishing
# (OIDC — no long-lived token) is registered against one workflow *filename* per
# package, and this package is registered as `publish.yml`. A job that runs
# `npm publish` from another file mints a token whose `job_workflow_ref` points
# at that other file, and npm rejects it with a 404. Calling this workflow keeps
# `job_workflow_ref` pointed here, so both entry points stay authorized.
#
# There is deliberately no `release: published` trigger: that Release is created
# with GITHUB_TOKEN, and events raised by that token do not start workflow runs.
#
# The version published is whatever is in package.json on the selected ref, so
# dispatch this against a ref that already carries the intended version bump.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        # npm 12 blocks remote tarballs by default. Allow only URL dependencies
        # declared directly by this package (currently the pinned SheetJS build).
        run: npm ci --allow-remote=root

      # `prepublishOnly` rebuilds dist and runs the test suite before upload.
      # npm picks up the OIDC credentials automatically; no NODE_AUTH_TOKEN needed.
      - name: Publish
        run: npm publish --access public
