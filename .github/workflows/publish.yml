name: Publish to npm

# Manual escape hatch for publishing to npm with OIDC trusted publishing — no
# long-lived npm token. The normal path is the `publish` job in release.yml, which
# runs on a `v*` tag push; use this workflow to re-publish a version whose upload
# failed after the GitHub Release was already created.
#
# There is deliberately no `release: published` trigger: that Release is created
# with GITHUB_TOKEN, and events raised by that token do not start workflow runs.
#
# The version published is whatever is in package.json on the selected ref, so
# dispatch this against a ref that already carries the intended version bump.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        # npm 12 blocks remote tarballs by default. Allow only URL dependencies
        # declared directly by this package (currently the pinned SheetJS build).
        run: npm ci --allow-remote=root

      # `prepublishOnly` rebuilds dist and runs the test suite before upload.
      # npm picks up the OIDC credentials automatically; no NODE_AUTH_TOKEN needed.
      - name: Publish
        run: npm publish --access public
